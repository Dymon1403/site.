	<script>

const canvas =
    document.getElementById("particles");

const ctx =
    canvas.getContext("2d");


function resizeCanvas() {

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;

}


resizeCanvas();


window.addEventListener(
    "resize",
    resizeCanvas
);


const particles = [];


const particleCount = 120;


for (
    let i = 0;
    i < particleCount;
    i++
) {

    particles.push({

        x:
            Math.random()
            * canvas.width,

        y:
            Math.random()
            * canvas.height,


        vx:
            (Math.random() - 0.5)
            * 0.3,

        vy:
            (Math.random() - 0.5)
            * 0.3,


        size:
            Math.random() * 2 + 0.5

    });

}


/* audio */

let audioLevel = 0;


const audioButton =
    document.getElementById(
        "audioButton"
    );


audioButton.addEventListener(
    "click",

    async () => {

        try {

            const stream =
                await navigator
                    .mediaDevices
                    .getUserMedia({

                        audio: true

                    });


            const audioContext =
                new AudioContext();


            const source =
                audioContext
                    .createMediaStreamSource(
                        stream
                    );


            const analyser =
                audioContext
                    .createAnalyser();


            analyser.fftSize =
                256;


            source.connect(
                analyser
            );


            const dataArray =
                new Uint8Array(
                    analyser
                    .frequencyBinCount
                );


            audioButton.textContent =
                "[ audio enabled ]";


            function updateAudio() {

                analyser.getByteFrequencyData(
                    dataArray
                );


                let sum = 0;


                for (
                    let i = 0;
                    i < dataArray.length;
                    i++
                ) {

                    sum +=
                        dataArray[i];

                }


                const average =
                    sum
                    /
                    dataArray.length;


                audioLevel =
                    average / 255;


                requestAnimationFrame(
                    updateAudio
                );

            }


            updateAudio();

        }

        catch (error) {

            console.error(error);


            audioButton.textContent =
                "[ audio denied ]";

        }

    }
);


function draw() {

    ctx.clearRect(

        0,
        0,

        canvas.width,
        canvas.height

    );


    for (

        const particle

        of particles

    ) {


        /*
        random movement
        */


        particle.vx +=

            (Math.random() - 0.5)

            * 0.02;


        particle.vy +=

            (Math.random() - 0.5)

            * 0.02;


        /*
        audio reaction
        */


        const audioForce =

            audioLevel

            * 10;


        particle.vx +=

            (Math.random() - 0.5)

            * audioForce;


        particle.vy +=

            (Math.random() - 0.5)

            * audioForce;


        /*
        speed limit
        */


        const maxSpeed =

            10;

            +

            audioLevel

            * 5;


        particle.vx =

            Math.max(

                -maxSpeed,

                Math.min(

                    maxSpeed,

                    particle.vx

                )

            );


        particle.vy =

            Math.max(

                -maxSpeed,

                Math.min(

                    maxSpeed,

                    particle.vy

                )

            );


        /*
        move
        */


        particle.x +=
            particle.vx;


        particle.y +=
            particle.vy;


        /*
        screen borders
        */


        if (

            particle.x < 0

        ) {

            particle.x =
                canvas.width;

        }


        if (

            particle.x >
            canvas.width

        ) {

            particle.x = 0;

        }


        if (

            particle.y < 0

        ) {

            particle.y =
                canvas.height;

        }


        if (

            particle.y >
            canvas.height

        ) {

            particle.y = 0;

        }


        /*
        draw
        */


    const threshold = 0.01;

if (audioLevel > threshold) {

    const audioForce =
        audioLevel * 0.5;


    particle.vx +=
        (Math.random() - 0.5)
        * audioForce;


    particle.vy +=
        (Math.random() - 0.5)
        * audioForce;

}
else {

    particle.vx = 0;
    particle.vy = 0;

}
}


draw();

</script>

    <script>
    
    const text = "dmitrj";

    const characters =
	    "abcdefghijklmnopqrstuvwxyz0123456789!@#$%<>~";

    const element =
        document.getElementById("glitch");


    function glitch() {

        let result = "";

        for (let i = 0; i < text.length; i++) {

            if (Math.random() < 0.2) {

                result +=
                    characters[
                        Math.floor(
                            Math.random()
                            * characters.length
                        )
                    ];

            } else {

                result += text[i];

            }
        }

        element.textContent = result;
    }


    setInterval(glitch, 450);
</script>

<script>

const glitchCharacters =
    "abcdefghijklmnopqrstuvwxyz0123456789!@#$%<>~";


const links =
    document.querySelectorAll(".glitch-link");


links.forEach(link => {

    const originalText =
        link.textContent;


    let glitchInterval;


    link.addEventListener(
        "mouseenter",

        () => {

            glitchInterval =
                setInterval(() => {

                    let result = "";


                    for (
                        let i = 0;
                        i < originalText.length;
                        i++
                    ) {

                        if (
                            Math.random() < 0.25
                        ) {

                            result +=
                                glitchCharacters[
                                    Math.floor(
                                        Math.random()
                                        *
                                        glitchCharacters.length
                                    )
                                ];

                        } else {

                            result +=
                                originalText[i];

                        }

                    }


                    link.textContent =
                        result;

                },

                100
            );

        }
    );


    link.addEventListener(
        "mouseleave",

        () => {

            clearInterval(
                glitchInterval
            );


            link.textContent =
                originalText;

        }
    );

});

</script>
