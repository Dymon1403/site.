<script>

const canvas =
    document.getElementById("matrix");

const ctx =
    canvas.getContext("2d");


canvas.width =
    window.innerWidth;

canvas.height =
    window.innerHeight;


const fontSize = 13;


let columns =
    Math.floor(
        canvas.width / fontSize
    );


let drops =
    Array(columns).fill(1);


const backcharacters =
    "abcdefghijklmnopqrstuvwxyz0123456789";


function drawMatrix() {

    ctx.fillStyle =
        "rgba(17, 17, 17, 0.3)";


    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    ctx.fillStyle =
        "#7fff00";


    ctx.font =
        fontSize + "px monospace";


    for (
        let i = 0;
        i < drops.length;
        i++
    ) {

        const character =
            backcharacters[
                Math.floor(
                    Math.random()
                    * backcharacters.length
                )
            ];


        ctx.fillText(
            character,

            i * fontSize,

            drops[i] * fontSize
        );


        if (
            drops[i] * fontSize >
            canvas.height
            &&
            Math.random() > 0.975
        ) {

            drops[i] = 0;

        }


        drops[i]++;

    }

}


setInterval(
    drawMatrix,
    50
);


window.addEventListener(
    "resize",

    () => {

        canvas.width =
            window.innerWidth;

        canvas.height =
            window.innerHeight;


        columns =
            Math.floor(
                canvas.width / fontSize
            );


        drops =
            Array(columns).fill(1);

    }
);

</script>

<script>
    const text = "dmitrj";

    const characters =
	    "abcdefghijklmnopqrstuvwxyz0123456789!@#$%<>~";

    const element =
        document.getElementById("glitch");


    function glitch() {

        let result = "";

        for (let i = 0; i < text.length; i++) {

            if (Math.random() < 0.2) {

                result +=
                    characters[
                        Math.floor(
                            Math.random()
                            * characters.length
                        )
                    ];

            } else {

                result += text[i];

            }
        }

        element.textContent = result;
    }


    setInterval(glitch, 450);
</script>

<script>

const glitchCharacters =
    "abcdefghijklmnopqrstuvwxyz0123456789!@#$%<>~";


const links =
    document.querySelectorAll(".glitch-link");


links.forEach(link => {

    const originalText =
        link.textContent;


    let glitchInterval;


    link.addEventListener(
        "mouseenter",

        () => {

            glitchInterval =
                setInterval(() => {

                    let result = "";


                    for (
                        let i = 0;
                        i < originalText.length;
                        i++
                    ) {

                        if (
                            Math.random() < 0.25
                        ) {

                            result +=
                                glitchCharacters[
                                    Math.floor(
                                        Math.random()
                                        *
                                        glitchCharacters.length
                                    )
                                ];

                        } else {

                            result +=
                                originalText[i];

                        }

                    }


                    link.textContent =
                        result;

                },

                100
            );

        }
    );


    link.addEventListener(
        "mouseleave",

        () => {

            clearInterval(
                glitchInterval
            );


            link.textContent =
                originalText;

        }
    );

});

</script>

</body>

</html>
